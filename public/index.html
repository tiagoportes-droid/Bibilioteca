<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="app.js"></script> 
    <title>Cadastro de Produtos</title>
  </head>
  <body>
    <div class="conteiner">
      <form id="formulario">
        <label for="txtTitulo">Titulo:
          <input type="text" id="txtTitulo" placeholder="Titulo" required />
        </label>

        <label for="txtDesc">Descrição:
          <input type="text" id="txtDesc" placeholder="Descrição" required />
        </label>

        <label for="txtAutor">Autor:
          <input type="text" id="txtAutor" placeholder="Autor" required />
        </label>

        <button type="submit" id="btnEnviar">Enviar</button>
        
        <div id="resposta"></div>
      </form>

      <ul id="listaProdutos"></ul>
    </div>
  </body>
</html>
